<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1take</title>
  <!--META-->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="1take">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/welcome.js"></script>
</head>
<body class="feed-page">
  <header class="float-header">
    <a class="logo" href="/">1take</a>
    <nav>
      <button class="help-btn" type="button" data-help hidden aria-label="How 1take works" title="How 1take works"></button>
      <button class="bell" id="bell" type="button" hidden></button>
      <a class="ghost-link" id="me" hidden>You</a>
      <a class="btn live" href="/go">Record</a>
    </nav>
  </header>
  <!-- The open challenge and the time left (or when the next one opens); filled in by challenge.js. -->
  <div id="strip" hidden></div>
  <main class="feed" id="feed" aria-label="Broadcasts"></main>
  <script type="module">
    import { createFeed } from '/feed.js';
    import { setupBell } from '/notify.js';
    import { setupStrip } from '/challenge.js';
    setupBell(document.getElementById('bell'));
    setupStrip(document.getElementById('strip'));
    try {
      const me = JSON.parse(localStorage.getItem('live5:user') || 'null');
      if (me && me.id) { const a = document.getElementById('me'); a.href = `/u/${me.id}`; a.hidden = false; }
    } catch {}
    // A shared link (/watch/<id>) opens this same feed with that broadcast first.
    const shared = /^\/watch\/([^/]+)$/.exec(location.pathname);
    createFeed(document.getElementById('feed'), {
      first: shared ? decodeURIComponent(shared[1]) : null,
      emptyTitle: 'Nothing here yet',
      emptyText: 'Nobody has recorded anything so far. You could be first.',
    });
  </script>
</body>
</html>
