<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profile · live5</title>
  <!--META-->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="live5">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/app.css">
  <script src="/welcome.js" defer></script>
</head>
<body class="feed-page">
  <header class="float-header">
    <a class="logo" href="/">live5</a>
    <nav><button class="bell" id="bell" type="button" hidden></button><a class="btn live" href="/go">Go live</a></nav>
  </header>
  <main class="feed" id="feed">
    <!-- Profile heading at the top of the page; it scrolls away with the feed, and this
         person's lives follow straight after it. -->
    <section class="profile-head">
      <span class="avatar lg" id="avatar" aria-hidden="true"></span>
      <div class="profile-text">
        <h1 id="name">&nbsp;</h1>
        <p id="meta"></p>
        <span class="chip" id="you" hidden>You</span>
      </div>
    </section>
  </main>
  <script type="module">
    import { createFeed, avatarNode } from '/feed.js';
    import { setupBell } from '/notify.js';
    setupBell(document.getElementById('bell'));
    const $ = (x) => document.getElementById(x);
    const id = decodeURIComponent(location.pathname.split('/').pop());
    let me = null;
    try { me = JSON.parse(localStorage.getItem('live5:user') || 'null'); } catch {}

    const r = await fetch(`/api/users/${encodeURIComponent(id)}`).catch(() => null);
    if (!r || !r.ok) {
      $('name').textContent = 'Profile not found';
      $('meta').textContent = r && r.status === 404 ? 'This profile does not exist.' : 'Could not load this profile.';
    } else {
      const u = await r.json();
      const count = u.broadcasts.filter((b) => b.status === 'live' || b.endedAt).length;
      const liveNow = u.broadcasts.some((b) => b.status === 'live');
      document.title = `${u.name} · live5`;
      $('name').textContent = u.name;
      const avatar = avatarNode(u.avatar, u.name, `avatar lg${liveNow ? ' is-live' : ''}`);
      avatar.id = 'avatar';
      $('avatar').replaceWith(avatar);
      $('meta').textContent = liveNow
        ? `Live now · ${count} ${count === 1 ? 'live' : 'lives'}`
        : `${count} ${count === 1 ? 'live' : 'lives'} · joined ${new Date(u.createdAt).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}`;
      $('you').hidden = !(me && me.id === u.id);
      createFeed($('feed'), {
        user: u.id,
        emptyTitle: 'No lives yet',
        emptyText: me && me.id === u.id ? 'Your lives will show up here.' : `${u.name} hasn’t gone live yet.`,
      });
    }
  </script>
</body>
</html>
