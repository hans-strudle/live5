<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch · live5</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <header>
    <a class="logo" href="/">live<span>5</span></a>
    <a class="btn" href="/go">Go live</a>
  </header>
  <div class="who-line"><h1><a id="who"></a></h1></div>
  <div class="stage">
    <video id="v" autoplay muted playsinline controls></video>
    <div class="badge" id="badge"></div>
  </div>
  <p class="muted" id="msg" style="text-align:center"></p>
</main>
<script>
  const id = location.pathname.split('/').pop();
  const v = document.getElementById('v'), badge = document.getElementById('badge'), msg = document.getElementById('msg');
  const videoUrl = `/api/streams/${id}/video`;
  let live = false, failed = false;

  async function status() {
    const r = await fetch(`/api/streams/${id}`).catch(() => null);
    if (!r || !r.ok) { msg.textContent = 'This broadcast does not exist (or the server restarted).'; badge.hidden = true; return null; }
    const s = await r.json();
    live = s.status === 'live';
    document.getElementById('who').textContent = s.name || 'Someone';
    document.getElementById('who').href = `/u/${s.userId}`;
    document.title = `${s.name || 'Someone'} · live5`;
    badge.textContent = live ? 'LIVE' : 'REPLAY';
    badge.classList.toggle('on', live);
    if (!failed) msg.textContent = live ? `${s.viewers} watching · tap the video for sound` : 'This broadcast has ended.';
    return s;
  }

  // Media Source playback works for an open-ended live stream on every modern phone:
  // ManagedMediaSource on iOS Safari 17.1+, MediaSource on Android/desktop.
  const MS = window.ManagedMediaSource || window.MediaSource;

  function mseType(type) {
    if (!MS) return null;
    const base = type.split(';')[0].trim();
    const guesses = [type, ...(base === 'video/mp4'
      ? ['video/mp4; codecs="avc1.42E01E, mp4a.40.2"', 'video/mp4; codecs="avc1.4D401F, mp4a.40.2"', 'video/mp4; codecs="avc1.42E01E"']
      : ['video/webm; codecs="vp8, opus"', 'video/webm; codecs="vp9, opus"', 'video/webm; codecs="vp8"'])];
    return guesses.find((t) => { try { return MS.isTypeSupported(t); } catch { return false; } }) || null;
  }

  function playMse(type) {
    const ms = new MS();
    if (window.ManagedMediaSource && MS === window.ManagedMediaSource) v.disableRemotePlayback = true;
    v.src = URL.createObjectURL(ms);
    ms.addEventListener('sourceopen', async () => {
      const sb = ms.addSourceBuffer(type);
      const append = (buf) => new Promise((resolve, reject) => {
        sb.addEventListener('updateend', resolve, { once: true });
        sb.addEventListener('error', reject, { once: true });
        sb.appendBuffer(buf);
      });
      try {
        const res = await fetch(videoUrl);
        const reader = res.body.getReader();
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value && value.length) await append(value);
          jumpToEdge();
          v.play().catch(() => {});
        }
        if (ms.readyState === 'open') ms.endOfStream();
      } catch (e) {
        showError();
      }
    }, { once: true });
  }

  function jumpToEdge() {
    if (!live || !v.buffered.length) return;
    const edge = v.buffered.end(v.buffered.length - 1);
    // Stay ~1s behind the newest data so playback doesn't stall waiting for the next chunk.
    if (edge - v.currentTime > 3) v.currentTime = Math.max(0, edge - 1);
  }

  function showError() {
    failed = true;
    msg.textContent = 'This browser cannot play this broadcast. Try updating it, or open the link in Chrome or Safari.';
  }

  (async () => {
    const s = await status();
    if (!s) return;
    const type = mseType(s.type || '');
    if (type) {
      playMse(type);
    } else {
      // Fallback: a plain <video>. Fine for replays (served with Range support).
      v.src = videoUrl;
      v.addEventListener('progress', jumpToEdge);
      v.addEventListener('error', showError);
      v.play().catch(() => {});
    }
    const poll = setInterval(async () => { const s = await status(); if (!s || s.status !== 'live') clearInterval(poll); }, 3000);
  })();
</script>
</body>
</html>
