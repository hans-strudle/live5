<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Record · live5</title>
  <!--META-->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="live5">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/app.css">
  <script src="/welcome.js" defer></script>
</head>
<body>
<!-- The studio: the camera fills the screen; status across the top, controls over the bottom.
     The Record button is there from the start (greyed out until the camera is ready).
     Someone without a profile is asked for their name in a popup over the camera when they
     press Record. Recording is live: viewers see it as it happens, but the wording here is
     about recording one take, not about being live. -->
<div id="studio" class="studio">
  <video id="cam" autoplay muted playsinline></video>
  <!-- After a take: the last camera frame stays on screen instead of going black. -->
  <img class="endframe" id="endframe" alt="" hidden>
  <div class="studio-top">
    <a class="logo" href="/" aria-label="Back to live5">live5</a>
    <div class="badge" id="badge">READY</div>
    <div class="timer" id="timer" hidden></div>
    <button class="flip-btn" id="flip" type="button" hidden aria-label="Switch camera" title="Switch camera"></button>
  </div>
  <div class="bar" id="bar"></div>
  <div class="studio-bottom">
    <p class="as" id="as"></p>
    <div class="controls">
      <button class="btn live go-btn" id="go" disabled>Record</button>
      <button class="btn go-btn end" id="stop" hidden>End</button>
      <button class="live-share" id="live-share" type="button" hidden aria-label="Share your take" title="Share your take"></button>
      <button class="btn ghost" id="retry" hidden>Try camera again</button>
    </div>
    <p class="quota" id="quota" hidden></p>
    <p class="studio-msg" id="msg">Starting camera…</p>
    <p class="share" id="share" hidden></p>
    <!-- End screen: shown once a take has ended. -->
    <div class="end-panel" id="end" hidden>
      <h2 id="end-title">That’s your take</h2>
      <p id="end-sub"></p>
      <div class="end-actions">
        <button class="btn" id="replay" type="button">Watch replay</button>
        <button class="btn ghost-light" id="end-share" type="button">Share</button>
      </div>
      <p class="end-links"><span id="end-again" hidden><a href="/go">Record another</a> · </span><a id="end-profile" href="/">Your profile</a> · <a href="/">Back to the feed</a></p>
    </div>
  </div>
</div>
<script type="module">
  import { getUser, clearUser, authHeaders as headersFor, ensureUser, askName, renameUser } from '/me.js';
  import { shareStream, shareIcon } from '/share.js';
  import { icon } from '/icons.js';
  const $ = (id) => document.getElementById(id);
  const cam = $('cam'), go = $('go'), stop = $('stop'), retry = $('retry'), msg = $('msg');
  const TIME_UP = 'Time is up.', STOPPED = 'You ended the broadcast.';
  let media, recorder, stream, mime, seq = 0, queue = Promise.resolve(), tick, ending = false;
  let lost = false; // a piece of video could not be delivered, so no later piece can be either
  let wakeLock = null;
  const FACING_KEY = 'live5:camera';
  let facing = (() => { try { return localStorage.getItem(FACING_KEY) === 'environment' ? 'environment' : 'user'; } catch { return 'user'; } })();
  let switching = false; // in the middle of changing cameras
  let startedAt = 0, endDone = Promise.resolve(); // when the live started; resolves once the server has ended it

  // MP4 (H.264/AAC) first: it plays on iOS and Android alike. WebM is the fallback.
  function pickMime(hasAudio) {
    const candidates = hasAudio
      ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4',
         'video/webm;codecs=vp8,opus', 'video/webm']
      : ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4',
         'video/webm;codecs=vp8', 'video/webm'];
    return candidates.find((t) => MediaRecorder.isTypeSupported(t));
  }

  function explain(e) {
    switch (e && e.name) {
      case 'NotAllowedError':
      case 'SecurityError':
        return 'Camera permission was blocked. Allow camera and microphone for this site in your browser settings, then try again.';
      case 'NotFoundError':
      case 'OverconstrainedError':
        return 'No camera was found on this device.';
      case 'NotReadableError':
      case 'AbortError':
        return 'The camera is busy. Close other apps or tabs using it, then try again.';
      default:
        return `Camera unavailable: ${(e && e.message) || e}`;
    }
  }

  async function openCamera() {
    retry.hidden = true;
    msg.textContent = 'Starting camera…';
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const https = `https://${location.host}${location.pathname}`;
      msg.innerHTML = 'Phones only allow the camera on a secure (HTTPS) page. '
        + `Open <a href="${https}">${https}</a> instead (the server needs <code>npm run cert</code> first).`;
      return;
    }
    if (!window.MediaRecorder) { msg.textContent = 'This browser cannot record video. Update it and try again.'; return; }

    // Phones can't have two cameras open at once, and some won't open the other one until the
    // first is fully stopped. So whatever was open is closed before asking again.
    closeCamera();

    // Try progressively simpler requests: some phones reject specific sizes or lack a mic.
    const size = { width: { ideal: 720 }, height: { ideal: 1280 } };
    const attempts = [
      { video: { facingMode: { exact: facing }, ...size }, audio: true }, // this camera, nothing else
      { video: { facingMode: facing, ...size }, audio: true },
      { video: true, audio: true },
      { video: true, audio: false },
    ];
    let lastError;
    for (const constraints of attempts) {
      try { media = await navigator.mediaDevices.getUserMedia(constraints); break; }
      catch (e) { lastError = e; if (e.name === 'NotAllowedError') break; }
    }
    if (!media) { msg.textContent = explain(lastError); retry.hidden = false; return; }

    mime = pickMime(media.getAudioTracks().length > 0);
    if (!mime) { msg.textContent = 'This browser cannot record video in a supported format.'; return; }
    // Go by the camera that actually opened, which may not be the one asked for.
    const got = facingOf(media);
    if (got) facing = got;
    // Only the front camera is shown mirrored.
    $('studio').classList.toggle('rear', facing === 'environment');
    cam.srcObject = media;
    cam.play().catch(() => {});
    go.disabled = !canGoLive();
    msg.textContent = ''; // camera ready: nothing to say
    offerFlip();
  }
  retry.onclick = openCamera;

  function closeCamera() {
    if (media) media.getTracks().forEach((t) => t.stop());
    media = null;
    cam.srcObject = null;
  }

  // 'user' (front) or 'environment' (back), as the camera itself reports it. Webcams report neither.
  function facingOf(m) {
    const f = m.getVideoTracks()[0]?.getSettings?.().facingMode;
    return f === 'user' || f === 'environment' ? f : null;
  }

  // Switching cameras: front or back, chosen before going live and remembered on this device.
  // Not while live: the recorder is tied to the camera it started with, and swapping it mid-way
  // ends the recording.
  const flip = $('flip');
  flip.append(icon('flip', 22));
  // The button is only offered on a device with a front and a back camera.
  async function offerFlip() {
    flip.hidden = true;
    if (recorder || !media || !facingOf(media)) return;
    const devices = await navigator.mediaDevices.enumerateDevices().catch(() => []);
    flip.hidden = !!recorder || !media || devices.filter((d) => d.kind === 'videoinput').length < 2;
  }
  flip.onclick = async () => {
    if (switching || recorder) return;
    switching = true;
    flip.disabled = true;
    go.disabled = true;
    const before = facing;
    try {
      facing = before === 'user' ? 'environment' : 'user';
      await openCamera();
      if (!media) { // the other camera wouldn't open: go back to the one that worked
        facing = before;
        await openCamera();
        if (media) msg.textContent = 'Couldn’t switch cameras.';
      } else if (facing === before) {
        msg.textContent = 'Couldn’t switch cameras.';
      }
      try { localStorage.setItem(FACING_KEY, facing); } catch {}
    } finally {
      switching = false;
      flip.disabled = false;
    }
  };

  // Who is going live. No login: the server gives this device a user (public UUID + private
  // key) the first time a name is entered; the key stays in this browser (see me.js). Broadcasts
  // are tied to the UUID, so changing the name keeps the same profile.
  let user = getUser();
  const authHeaders = () => headersFor(user);

  // Daily limit, as reported by the server (it enforces the limit; this only explains it).
  let usage = null, quotaTimer = null;
  function takeUsage(body) {
    if (!body || typeof body.dailyLimit !== 'number') return;
    usage = { dailyLimit: body.dailyLimit, limitHours: body.limitHours ?? 12, leftToday: body.leftToday, nextAt: body.nextAt };
    renderQuota();
  }
  const canGoLive = () => !usage || usage.leftToday > 0;
  function whenText(t) {
    const d = new Date(t);
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toDateString() === new Date().toDateString() ? `at ${time}` : `tomorrow at ${time}`;
  }
  // "13h 22m", "4m 05s", "12s"
  function untilText(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h) return `${h}h ${m}m`;
    if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
    return `${sec}s`;
  }

  // While locked, the Record button itself counts down to the next take.
  let lockTick = null;
  function renderLockedButton() {
    if (recorder || !usage || usage.leftToday > 0 || !usage.nextAt) return;
    go.textContent = `Next take in ${untilText(usage.nextAt - Date.now())}`;
  }

  function renderQuota() {
    const q = $('quota');
    clearTimeout(quotaTimer);
    clearInterval(lockTick);
    if (!usage) { q.hidden = true; return; }
    q.hidden = false;
    const out = usage.leftToday === 0;
    const one = usage.dailyLimit === 1;
    q.classList.toggle('out', out);
    const hours = usage.limitHours;
    if (out) {
      const when = usage.nextAt ? whenText(usage.nextAt) : null;
      const used = one ? `One take every ${hours} hours.` : `All ${usage.dailyLimit} takes used.`;
      q.textContent = when ? `${used} Next one ${when}.` : used;
    } else {
      q.textContent = one
        ? `One take every ${hours} hours.`
        : `${usage.leftToday} of ${usage.dailyLimit} takes left (per ${hours} hours)`;
    }
    if (!recorder) {
      go.classList.toggle('locked', out);
      if (out) {
        go.disabled = true;
        renderLockedButton();
        lockTick = setInterval(renderLockedButton, 1000);
      } else {
        go.textContent = 'Record';
        if (media) go.disabled = false;
      }
    }
    // When the lock ends, ask the server again so the button comes back on its own.
    if (out && usage.nextAt && !recorder) {
      quotaTimer = setTimeout(refreshUsage, Math.max(1000, usage.nextAt - Date.now() + 1000));
    }
  }
  async function refreshUsage() {
    const r = await fetch('/api/users/me', { headers: authHeaders() }).catch(() => null);
    if (r && r.ok) takeUsage(await r.json());
  }

  // "Recording as Name · change name · your profile" (nothing until there's a user).
  function renderAs() {
    const as = $('as');
    as.replaceChildren();
    if (!user) return;
    const b = document.createElement('strong');
    b.textContent = user.name;
    const change = document.createElement('a');
    change.href = '#';
    change.textContent = 'change name';
    change.onclick = async (e) => {
      e.preventDefault();
      if (recorder) return;
      const updated = await askName({
        title: 'Change your name', initial: user.name, action: 'Save',
        note: 'Shown on your takes and comments.',
        onSubmit: (name) => renameUser(user, name),
      });
      if (updated) { user = updated; renderAs(); refreshUsage(); }
    };
    const profile = document.createElement('a');
    profile.href = `/u/${user.id}`;
    profile.textContent = 'your profile';
    as.append('Recording as ', b, ' · ', change, ' · ', profile);
  }

  // The camera starts right away for everyone; the name is only asked for when going live.
  openCamera();
  (async () => {
    if (!user) return;
    // Make sure this server still knows this device's user (e.g. after its data was reset).
    const r = await fetch('/api/users/me', { headers: authHeaders() }).catch(() => null);
    if (r && r.status === 401) { clearUser(); user = null; renderAs(); return; }
    if (r && r.ok) {
      const me = await r.json();
      user = { ...user, name: me.name };
      takeUsage(me);
    }
    renderAs();
  })();

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Deliver one piece of video. A phone's connection drops for a moment now and then, so a
  // failed request is tried again (the server ends a live that goes quiet for about 10 seconds).
  // Returns 'ok', 'offline' (never got through) or 'ended' (the server has closed the broadcast).
  async function deliver(n, blob) {
    for (let attempt = 0; ; attempt++) {
      let r = null;
      try {
        r = await fetch(`/api/streams/${stream.id}/chunks?seq=${n}`, {
          method: 'POST', headers: { 'x-broadcast-token': stream.token }, body: blob,
          signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined,
        });
      } catch {}
      if (r && r.ok) return 'ok';
      if (r) {
        if (r.status !== 409) return 'ended';
        // 409 names the piece the server expects next. One past this: it arrived and only the
        // answer was lost. This one: the server is still busy with the earlier attempt.
        const expected = (await r.json().catch(() => null))?.expected;
        if (expected === n + 1) return 'ok';
        if (expected !== n) return 'ended';
      }
      if (attempt >= 4) return r ? 'ended' : 'offline';
      await sleep(300 * 2 ** attempt);
    }
  }

  // Pieces go one at a time, in order.
  function send(blob) {
    const n = seq++;
    queue = queue.then(async () => {
      if (lost) return;
      const result = await deliver(n, blob);
      if (result === 'ok') return;
      lost = true;
      finish(result === 'offline' ? 'The connection was lost.' : 'The broadcast was closed.');
    });
  }

  // Keep the last camera frame on screen (as the preview showed it) so ending isn't a black screen.
  function freezeFrame() {
    if (!cam.videoWidth) return;
    try {
      const c = document.createElement('canvas');
      c.width = cam.videoWidth;
      c.height = cam.videoHeight;
      c.getContext('2d').drawImage(cam, 0, 0);
      $('endframe').src = c.toDataURL('image/jpeg', 0.85);
      $('endframe').hidden = false;
    } catch {}
  }

  function finish(text) {
    if (ending) return;
    ending = true;
    clearInterval(tick);
    wakeLock?.release().catch(() => {});
    freezeFrame();
    // Stopping hands over the last recorded piece (on Android Chrome this can be several
    // seconds of video). Wait for it to be sent before ending the broadcast.
    const stopped = recorder && recorder.state !== 'inactive'
      ? new Promise((resolve) => { recorder.addEventListener('stop', resolve, { once: true }); recorder.stop(); })
      : Promise.resolve();
    if (stream) {
      endDone = stopped.then(() => queue).then(() => fetch(`/api/streams/${stream.id}/end`, {
        method: 'POST', headers: { 'x-broadcast-token': stream.token },
      })).catch(() => {});
    }
    stopped.then(() => media.getTracks().forEach((t) => t.stop()));
    $('badge').textContent = 'ENDED';
    $('badge').classList.remove('on');
    $('timer').hidden = true;
    stop.hidden = true;
    $('live-share').hidden = true;
    // Back to the full screen: the end panel, plus when the next live unlocks.
    $('studio').classList.remove('is-live');
    $('studio').classList.add('is-ended');
    if (!stream) { // never went live (e.g. couldn't start): just say so
      const again = document.createElement('a');
      again.href = '/go';
      again.textContent = 'Try again';
      msg.replaceChildren(`${text} `, again);
      return;
    }
    showEndScreen(text);
  }

  // The end screen: what happened, how long it was, and what next (replay, share, go again).
  function showEndScreen(text) {
    const secs = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
    $('end-title').textContent = text === TIME_UP ? 'Time’s up' : 'That’s your take';
    const why = text === TIME_UP || text === STOPPED ? '' : ` ${text}`;
    $('end-sub').textContent = `You recorded ${secs} second${secs === 1 ? '' : 's'}.${why}`;
    $('end-profile').href = `/u/${user.id}`;
    $('end-again').hidden = !(usage && usage.leftToday > 0); // only if the limit allows another
    $('as').hidden = true;
    $('share').hidden = true;
    go.hidden = true;
    msg.textContent = '';
    $('end').hidden = false;

    $('end-share').onclick = () => shareStream({ ...stream, name: user.name, status: 'ended' });
    // Play the replay right here, once the last piece has been sent and the server has it.
    $('replay').onclick = async () => {
      $('replay').disabled = true;
      $('replay').textContent = 'Loading…';
      await endDone; // last piece sent and the broadcast closed, so the replay is complete
      cam.srcObject = null;
      cam.classList.add('replay');
      cam.src = `/api/streams/${stream.id}/video`;
      cam.muted = false; // this tap allows sound
      cam.loop = true;
      cam.onplaying = () => {
        $('endframe').hidden = true;
        $('replay').hidden = true;
        $('end-title').textContent = 'Your replay';
      };
      cam.onerror = () => { $('replay').disabled = false; $('replay').textContent = 'Watch replay'; };
      cam.play().catch(() => { cam.muted = true; cam.play().catch(() => {}); });
    };
  }

  go.onclick = async () => {
    if (!canGoLive() || switching || !media) return;
    go.disabled = true;
    // First time: ask for a name in a popup over the camera, then go live straight away.
    if (!user) {
      user = await ensureUser({
        title: 'Your name before you record',
        note: 'Shown to everyone who watches. No account needed.',
        action: 'Record',
      });
      if (!user) { go.disabled = false; return; } // cancelled
      renderAs();
    }
    flip.hidden = true; // the camera is fixed from here on
    try {
      // A key frame every second: Chrome cuts MP4 pieces at key frames, so without this Android
      // sends ~6-second pieces and live viewers wait that long. Browsers that don't know the
      // option ignore it.
      recorder = new MediaRecorder(media, {
        mimeType: mime, videoBitsPerSecond: 1_500_000, videoKeyFrameIntervalDuration: 1000,
      });
    } catch {
      recorder = new MediaRecorder(media);
    }
    // Chunks wait in the queue until the stream exists, so nothing recorded is lost.
    let created;
    queue = new Promise((r) => { created = r; });
    // Pieces that arrive while ending (the recorder's final flush) are still sent.
    recorder.ondataavailable = (e) => { if (e.data.size) send(e.data); };
    // The recorder stopping by itself means the camera went away (a call came in, permission
    // was taken back): say so now rather than showing REC over nothing until the time runs out.
    recorder.onstop = () => { if (!ending) finish('The camera stopped.'); };
    recorder.onerror = () => finish('Recording failed.');
    recorder.start(500);

    // The recorder reports its real format (with codecs) once started; viewers need it.
    const type = recorder.mimeType || mime;
    const r = await fetch('/api/streams', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ type }),
    }).catch(() => null);
    if (!r || !r.ok) {
      const err = r && (await r.json().catch(() => null));
      takeUsage(err); // a 429 carries the current usage and when the next live frees up
      finish(`Couldn’t start recording${err && err.error ? `: ${err.error}` : ''}.`);
      return;
    }
    stream = await r.json();
    takeUsage(stream);
    created();
    setTimeout(() => sendPreview().catch(() => {}), 800);

    // Keep the screen on for the length of the live (where the browser can).
    navigator.wakeLock?.request('screen').then((lock) => {
      if (ending) lock.release().catch(() => {}); else wakeLock = lock;
    }).catch(() => {});

    startedAt = Date.now();
    const started = startedAt, limit = stream.maxSeconds * 1000;
    // While live, keep the screen clear: just the badge and countdown on top, and a slim End
    // button with a small share icon at the bottom (CSS hides the rest under .is-live).
    $('studio').classList.add('is-live');
    go.hidden = true; stop.hidden = false;
    $('badge').textContent = 'REC'; $('badge').classList.add('on');
    $('timer').hidden = false;
    const liveShare = $('live-share');
    liveShare.replaceChildren(shareIcon());
    liveShare.onclick = () => shareStream({ ...stream, name: user.name, status: 'live' });
    liveShare.hidden = false;
    msg.textContent = '';
    tick = setInterval(() => {
      const left = Math.max(0, limit - (Date.now() - started));
      const secs = Math.ceil(left / 1000);
      $('timer').textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
      $('bar').style.width = `${100 - (left / limit) * 100}%`;
      if (left <= 0) finish(TIME_UP);
    }, 250);
  };
  stop.onclick = () => finish(STOPPED);

  // Leaving the page mid-live: tell the server now, so viewers aren't left on a frozen picture
  // until it notices by itself.
  addEventListener('pagehide', () => {
    if (!stream || ending) return;
    fetch(`/api/streams/${stream.id}/end`, {
      method: 'POST', headers: { 'x-broadcast-token': stream.token }, keepalive: true,
    }).catch(() => {});
  });

  // The feed's preview image: one frame from the live camera, taken just after going live.
  async function sendPreview() {
    if (!cam.videoWidth || ending) return;
    const w = 360, h = Math.round((w * cam.videoHeight) / cam.videoWidth);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(cam, 0, 0, w, h);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.7));
    if (!blob || ending) return;
    await fetch(`/api/streams/${stream.id}/poster`, {
      method: 'POST', headers: { 'x-broadcast-token': stream.token, 'content-type': 'image/jpeg' }, body: blob,
    });
  }
</script>
</body>
</html>
